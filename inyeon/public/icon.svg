<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#2A1E14"/>
      <stop offset="46%" stop-color="#17110B"/>
      <stop offset="100%" stop-color="#0C0906"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(240,196,126,0.42)"/>
      <stop offset="70%" stop-color="rgba(240,196,126,0)"/>
    </radialGradient>
    <radialGradient id="ember" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FBEAC4"/>
      <stop offset="68%" stop-color="#D6963F"/>
      <stop offset="100%" stop-color="#B07830"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- faint fractal branches rising to the light -->
  <g fill="none" stroke="#C99A46" stroke-linecap="round" stroke-linejoin="round" opacity="0.34">
    <path d="M256 430 Q252 340 256 250" stroke-width="9"/>
    <path d="M256 320 Q214 292 190 250" stroke-width="6"/>
    <path d="M256 300 Q300 274 326 232" stroke-width="6"/>
    <path d="M190 250 Q176 224 168 196" stroke-width="3.4"/>
    <path d="M326 232 Q340 208 348 182" stroke-width="3.4"/>
  </g>
  <!-- settled and growing lights -->
  <circle cx="168" cy="196" r="8" fill="#A0794E" opacity="0.7"/>
  <circle cx="348" cy="182" r="9" fill="#C0834A"/>
  <!-- central halo + ember -->
  <circle cx="256" cy="228" r="150" fill="url(#halo)"/>
  <circle cx="256" cy="228" r="26" fill="url(#ember)"/>
</svg>
