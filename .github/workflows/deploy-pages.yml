name: Deploy Inyeon to GitHub Pages

# Publishes inyeon/dist to the gh-pages branch. Creating that branch
# auto-enables GitHub Pages (branch source) on repos that never configured
# Pages — no Settings toggle and no site-creation API call, which the
# workflow GITHUB_TOKEN is not allowed to make.

on:
  push:
    branches: [main]
    paths:
      - 'inyeon/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inyeon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inyeon/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: inyeon/dist
          commit_message: 'Deploy Inyeon ${{ github.sha }}'
