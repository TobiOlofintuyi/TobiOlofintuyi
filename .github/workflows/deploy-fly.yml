name: Deploy Inyeon to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'inyeon/**'
      - '.github/workflows/deploy-fly.yml'
  workflow_dispatch:

concurrency:
  group: fly
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is not set. Create one with 'fly tokens create deploy -a inyeon-forge' and add it under Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy inyeon --remote-only
