# Private preview server. Basic auth is mandatory (see entrypoint.sh —
# the container exits if no credentials are provided). No directory listing.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    auth_basic "clause.ink private preview";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Never cache HTML during preview; hashed assets can cache hard.
    location ~* \.html$ {
        add_header Cache-Control "no-store";
    }
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
